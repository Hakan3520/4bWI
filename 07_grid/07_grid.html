<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            background-color: red;
            padding: 12px;
        }

        .container {
            display: grid;
            grid-template-columns: 39% 60%;
            grid-template-rows: 100px 150px;
            grid-auto-rows: minmax(100px, auto);
            gap: 8px;
        }

        .item1 {
            grid-column-start: span 2;
        }

        .item2 {
            grid-row-start: span 2;
            background-color: red;
        }

        .item3 {
            background-color: red;
        }

        .item4 {
            grid-column-start: span 2;
            background-color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box item1">one</div>
        <div class="box item2">two</div>
        <div class="box item3">three</div>
        <div class="box item4">four</div>
        <div class="box item5">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit.
            Cum voluptate at fugiat id mollitia earum, odio,
            ducimus quidem ut labore quos adipisci, numquam voluptatem dignissimos!
        </div>
    </div>

</body>

</html>
