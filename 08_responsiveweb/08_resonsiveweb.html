<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box {
            background-color: red;
            padding: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: 33% 33% 33%;
            grid-auto-rows: minmax(150px, auto);
            column-gap: 1px;
            row-gap: 1px;
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
                grid-auto-rows: minmax(100px, auto);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box item1">one</div>
        <div class="box item2">two</div>
        <div class="box item3">three</div>
        <div class="box item4">four</div>
        <div class="box item5">
            Lorem ipsum dolor, sit amet consectetur adipisicing elit.
            Cum voluptate at fugiat id mollitia earum, odio,
            ducimus quidem ut labore quos adipisci, numquam voluptatem dignissimos!
        </div>
    </div>

</body>

</html>
