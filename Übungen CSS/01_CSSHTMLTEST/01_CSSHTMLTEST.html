<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .rahmen {
            border: 2px solid black;
            height: 500px;
            position: relative;
            padding: 20px;
        }

        .blau {
            background-color: lightblue;
            width: 55%;
            height: 140px;
            padding: 10px;
            position: relative;
        }

        .orange {
            background-color: orange;
            width: 60px;
            height: 60px;
            position: absolute;
            right: 0;
            bottom: 0;
        }

        .lila {
            background-color: plum;
            width: 80px;
            height: 80px;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
</head>

<body>

    <div class="rahmen">

        <div class="blau">
            <h2>Willkommen!</h2>

            <ul>
                <li>Eins</li>
                <li>Zwei</li>
                <li>Drei</li>
            </ul>

            <div class="orange"></div>
        </div>

        <div class="lila"></div>

    </div>

</body>

</html>
